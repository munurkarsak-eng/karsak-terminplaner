<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#07131d">
<title>Dachdecker Karsak – Terminplaner</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07131d;
  color:#fff;
  padding-bottom:90px
}

header{
  padding:22px 15px;
  text-align:center;
  border-bottom:1px solid #30404d
}

.logo{
  font-size:40px;
  font-weight:bold;
  color:#f6b92c
}

header h1{
  margin:5px 0;
  font-size:27px
}

.gold{
  color:#f6b92c;
  font-size:21px;
  font-weight:bold
}

.screen{
  display:none;
  max-width:760px;
  margin:auto;
  padding:16px
}

.screen.active{
  display:block
}

.card{
  background:#10202c;
  border:1px solid #304451;
  border-radius:18px;
  padding:17px;
  margin-bottom:15px
}

h2{
  margin-top:0
}

label{
  display:block;
  margin:15px 0 7px;
  font-size:20px;
  font-weight:bold
}

input,textarea,select{
  width:100%;
  padding:15px;
  background:white;
  color:#111;
  border:1px solid #aaa;
  border-radius:13px;
  font-size:20px
}

textarea{
  min-height:105px
}

.row{
  display:flex;
  gap:12px
}

.row>div{
  flex:1
}

button{
  border:0;
  border-radius:13px;
  padding:14px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer
}

.big{
  width:100%;
  min-height:72px;
  margin-bottom:12px;
  background:#10202c;
  color:#fff;
  border:1px solid #344654
}

.primary{
  width:100%;
  margin-top:16px;
  background:#f6b92c;
  color:#111;
  font-size:20px
}

.secondary{
  background:#263746;
  color:#fff
}

.danger{
  width:100%;
  margin-top:10px;
  background:#9e2727;
  color:#fff
}

.voiceButton{
  width:100%;
  min-height:85px;
  background:#f6b92c;
  color:#111;
  font-size:21px
}

.voiceResult{
  margin-top:15px;
  padding:14px;
  border-radius:12px;
  background:#172a38;
  line-height:1.5
}

.appointment{
  padding:14px;
  margin:10px 0;
  background:#172a38;
  border-left:5px solid #f6b92c;
  border-radius:10px
}

.appointment button{
  margin-top:9px;
  margin-right:5px;
  padding:9px 11px;
  font-size:14px
}

.small{
  color:#b8c2c9;
  font-size:14px
}

.empty{
  color:#aeb9c1;
  padding:25px;
  text-align:center
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:78px;
  display:flex;
  background:#09141e;
  border-top:1px solid #304451;
  z-index:50
}

.bottom button{
  flex:1;
  background:transparent;
  color:white;
  border-radius:0;
  padding:6px 2px;
  font-size:13px
}

.bottom span{
  display:block;
  font-size:25px
}
</style>
</head>

<body>

<header>
  <div class="logo">⌂K</div>
  <h1>DACHDECKER KARSAK</h1>
  <div class="gold">TERMINPLANER</div>
</header>

<section id="home" class="screen active">
  <div class="card">
    <h2>HEUTIGE TERMINE</h2>
    <div id="todayList"></div>
  </div>

  <button class="big" onclick="show('calendar')">📅 KALENDER</button>
  <button class="big" onclick="show('voice')">🎤 TERMIN SPRECHEN</button>
  <button class="big" onclick="newAppointment()">➕ NEUER TERMIN</button>
  <button class="big" onclick="show('saved')">📋 ALLE TERMINE</button>
</section>

<section id="voice" class="screen">
  <button class="secondary" onclick="show('home')">← Zurück</button>

  <div class="card">
    <h2>🎤 Termin sprechen</h2>

    <p>Zum Beispiel:</p>
    <p class="small">
      „Morgen um 7 Uhr 30 bei Herrn Karsak,
      Lange Straße 67, Dach besichtigen“
    </p>

    <button class="voiceButton" onclick="startVoice()">
      🎤 JETZT SPRECHEN
    </button>

    <div id="voiceText" class="voiceResult">
      Noch nichts gesprochen.
    </div>
  </div>
</section>

<section id="editor" class="screen">
  <button class="secondary" onclick="show('home')">← Zurück</button>

  <div class="card">
    <h2 id="editorTitle">Neuer Termin</h2>

    <label>Datum *</label>
    <input type="date" id="date">

    <div class="row">
      <div>
        <label>Von *</label>
        <input type="time" id="start">
      </div>

      <div>
        <label>Bis</label>
        <input type="time" id="end">
      </div>
    </div>

    <label>Kunde / Name *</label>
    <input id="customer" placeholder="z.B. Herr Müller">

    <label>Adresse / Baustelle</label>
    <input id="address" placeholder="z.B. Lange Straße 67, Wunstorf">

    <label>Telefon</label>
    <input id="phone" type="tel" placeholder="Telefonnummer">

    <label>Arbeit / Termin</label>
    <input id="job" placeholder="z.B. Dach besichtigen">

    <label>Notizen</label>
    <textarea id="notes"></textarea>

    <button class="primary" onclick="saveAppointment()">
      💾 TERMIN SPEICHERN
    </button>

    <button id="deleteBtn"
            class="danger"
            style="display:none"
            onclick="deleteAppointment()">
      🗑 TERMIN LÖSCHEN
    </button>
  </div>
</section>

<section id="calendar" class="screen">
  <button class="secondary" onclick="show('home')">← Zurück</button>

  <div class="card">
    <h2>📅 Kalender</h2>

    <input type="date"
           id="calDate"
           onchange="renderCalendar()">

    <div id="calendarList"></div>
  </div>
</section>

<section id="saved" class="screen">
  <button class="secondary" onclick="show('home')">← Zurück</button>

  <div class="card">
    <h2>Alle Termine</h2>
    <div id="allList"></div>
  </div>
</section>

<div class="bottom">
  <button onclick="show('home')">
    <span>🏠</span>Start
  </button>

  <button onclick="show('calendar')">
    <span>📅</span>Kalender
  </button>

  <button onclick="newAppointment()">
    <span>➕</span>Termin
  </button>

  <button onclick="show('voice')">
    <span>🎤</span>Sprache
  </button>
</div>

<script>
const KEY="karsakAppointments";

/* Alte Termine aus früheren Versionen übernehmen */
let appointments=[];

const oldKeys=[
  "karsakAppointments",
  "karsakAppointmentsV3",
  "karsakAppointmentsV4",
  "karsakAppointmentsV5"
];

for(const key of oldKeys){
  try{
    const arr=JSON.parse(localStorage.getItem(key)||"[]");

    if(Array.isArray(arr)){
      for(const item of arr){
        if(
          !appointments.some(
            a=>String(a.id)===String(item.id)
          )
        ){
          appointments.push(item);
        }
      }
    }
  }catch(e){}
}

localStorage.setItem(KEY,JSON.stringify(appointments));

let editingId=null;

function el(id){
  return document.getElementById(id);
}

function iso(d=new Date()){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");

  return y+"-"+m+"-"+day;
}

function addMinutes(time,minutes){
  if(!time)return "";

  let [h,m]=time.split(":").map(Number);
  let total=h*60+m+minutes;

  total=(total+1440)%1440;

  const hh=String(Math.floor(total/60)).padStart(2,"0");
  const mm=String(total%60).padStart(2,"0");

  return hh+":"+mm;
}

function esc(v){
  return String(v||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function show(id){
  document
    .querySelectorAll(".screen")
    .forEach(x=>x.classList.remove("active"));

  el(id).classList.add("active");

  if(id==="home")renderToday();
  if(id==="calendar")renderCalendar();
  if(id==="saved")renderAll();

  window.scrollTo(0,0);
}

function navigation(address){
  if(!address){
    alert("Keine Adresse eingetragen.");
    return;
  }

  const url=
    "https://www.google.com/maps/dir/?api=1&destination="+
    encodeURIComponent(address);

  window.open(url,"_blank");
}

function appointmentHTML(a){
  return `
  <div class="appointment">
    <div onclick="editAppointment('${a.id}')">
      <b>${esc(a.start)} – ${esc(a.customer)}</b><br>

      ${
        a.end
        ? esc(a.start)+" – "+esc(a.end)+" Uhr<br>"
        : ""
      }

      ${
        a.address
        ? "📍 "+esc(a.address)+"<br>"
        : ""
      }

      ${
        a.job
        ? "🔨 "+esc(a.job)+"<br>"
        : ""
      }

      ${
        a.phone
        ? "📞 "+esc(a.phone)+"<br>"
        : ""
      }

      ${
        a.notes
        ? "<span class='small'>"+esc(a.notes)+"</span>"
        : ""
      }
    </div>

    ${
      a.address
      ? `<button class="secondary"
          onclick="event.stopPropagation();navigation('${escJs(a.address)}')">
          📍 Navigation
        </button>`
      : ""
    }
  </div>`;
}

function escJs(v){
  return String(v||"")
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}

function list(items,target){
  const box=el(target);

  if(!items.length){
    box.innerHTML=
      "<div class='empty'>Keine Termine eingetragen.</div>";
    return;
  }

  items=[...items].sort(
    (a,b)=>
      (a.date+" "+a.start)
      .localeCompare(b.date+" "+b.start)
  );

  box.innerHTML=items.map(appointmentHTML).join("");
}

function renderToday(){
  list(
    appointments.filter(a=>a.date===iso()),
    "todayList"
  );
}

function renderCalendar(){
  const d=el("calDate").value||iso();

  el("calDate").value=d;

  list(
    appointments.filter(a=>a.date===d),
    "calendarList"
  );
}

function renderAll(){
  list(appointments,"allList");
}

function clearEditor(){
  el("date").value=iso();
  el("start").value="";
  el("end").value="";
  el("customer").value="";
  el("address").value="";
  el("phone").value="";
  el("job").value="";
  el("notes").value="";
}

function newAppointment(){
  editingId=null;

  clearEditor();

  el("editorTitle").textContent="Neuer Termin";
  el("deleteBtn").style.display="none";

  show("editor");
}

function editAppointment(id){
  const a=appointments.find(
    x=>String(x.id)===String(id)
  );

  if(!a)return;

  editingId=a.id;

  el("editorTitle").textContent="Termin bearbeiten";
  el("deleteBtn").style.display="block";

  el("date").value=a.date||"";
  el("start").value=a.start||"";
  el("end").value=a.end||"";
  el("customer").value=a.customer||"";
  el("address").value=a.address||"";
  el("phone").value=a.phone||"";
  el("job").value=a.job||"";
  el("notes").value=a.notes||"";

  show("editor");
}

function saveAppointment(){
  const a={
    id:editingId||String(Date.now()),
    date:el("date").value,
    start:el("start").value,
    end:el("end").value,
    customer:el("customer").value.trim(),
    address:el("address").value.trim(),
    phone:el("phone").value.trim(),
    job:el("job").value.trim(),
    notes:el("notes").value.trim()
  };

  if(!a.date){
    alert("Bitte Datum kontrollieren.");
    return;
  }

  if(!a.start){
    alert("Bitte Uhrzeit kontrollieren.");
    return;
  }

  if(!a.customer){
    alert("Bitte Kunde / Name kontrollieren.");
    return;
  }

  if(editingId){
    appointments=appointments.map(
      x=>String(x.id)===String(editingId) ? a : x
    );
  }else{
    appointments.push(a);
  }

  localStorage.setItem(KEY,JSON.stringify(appointments));

  editingId=null;

  alert("Termin gespeichert.");

  show("home");
}

function deleteAppointment(){
  if(!editingId)return;

  if(!confirm("Termin wirklich löschen?"))return;

  appointments=appointments.filter(
    a=>String(a.id)!==String(editingId)
  );

  localStorage.setItem(KEY,JSON.stringify(appointments));

  editingId=null;

  show("home");
}

/* ===================================================
   SPRACHE
=================================================== */

function startVoice(){
  const SpeechRecognition=
    window.SpeechRecognition||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert(
      "Die Spracheingabe wird von diesem Browser nicht unterstützt. Bitte Chrome verwenden."
    );
    return;
  }

  const rec=new SpeechRecognition();

  rec.lang="de-DE";
  rec.interimResults=false;
  rec.continuous=false;
  rec.maxAlternatives=1;

  el("voiceText").innerHTML=
    "<b>🎤 Ich höre zu …</b>";

  rec.onresult=function(e){
    const text=e.results[0][0].transcript.trim();

    el("voiceText").innerHTML=
      "<b>Erkannt:</b><br>"+esc(text);

    parseVoice(text);
  };

  rec.onerror=function(){
    el("voiceText").innerHTML=
      "Sprache konnte nicht erkannt werden. Bitte noch einmal sprechen.";
  };

  rec.start();
}

/* ===================================================
   DATUM
=================================================== */

function detectDate(text){
  const d=new Date();

  if(/\bübermorgen\b/i.test(text)){
    d.setDate(d.getDate()+2);
    return d;
  }

  if(/\bmorgen\b/i.test(text)){
    d.setDate(d.getDate()+1);
    return d;
  }

  if(/\bheute\b/i.test(text)){
    return d;
  }

  const explicit=text.match(
    /\b(\d{1,2})[.\-/](\d{1,2})(?:[.\-/](\d{2,4}))?\b/
  );

  if(explicit){
    let year=
      explicit[3]
      ? Number(explicit[3])
      : d.getFullYear();

    if(year<100)year+=2000;

    return new Date(
      year,
      Number(explicit[2])-1,
      Number(explicit[1])
    );
  }

  return d;
}

/* ===================================================
   UHRZEIT
=================================================== */

function detectTime(text){
  const patterns=[
    /\bum\s+(\d{1,2})[:.](\d{2})\s*(?:uhr)?/i,
    /\bum\s+(\d{1,2})\s*uhr\s*(\d{1,2})?/i,
    /\b(\d{1,2})[:.](\d{2})\s*uhr/i,
    /\b(\d{1,2})\s*uhr\s*(\d{1,2})?/i
  ];

  for(const p of patterns){
    const m=text.match(p);

    if(m){
      const h=Number(m[1]);
      const min=Number(m[2]||0);

      if(h<=23 && min<=59){
        return {
          value:
            String(h).padStart(2,"0")+
            ":"+
            String(min).padStart(2,"0"),
          matched:m[0]
        };
      }
    }
  }

  return {
    value:"",
    matched:""
  };
}

/* ===================================================
   ADRESSE
=================================================== */

function detectAddress(text){
  /*
    Erkennt z.B.
    Lange Straße 67
    Bahnhofstraße 73
    Am Stadtfelde 26
    Im Stadtfelde 26
    Hauptstraße 5A
  */

  const patterns=[
    /\b((?:Am|Im|An der|Auf der|In der)\s+[A-ZÄÖÜ][A-Za-zÄÖÜäöüß\- ]+\s+\d+[a-zA-Z]?)\b/i,

    /\b([A-ZÄÖÜ][A-Za-zÄÖÜäöüß\-]*(?:\s+[A-ZÄÖÜ][A-Za-zÄÖÜäöüß\-]*)*\s*(?:straße|strasse|weg|allee|platz|ring|damm|gasse|stieg|chaussee|kamp|ufer|markt|feld|hof)\s+\d+[a-zA-Z]?)\b/i
  ];

  for(const p of patterns){
    const m=text.match(p);

    if(m){
      let value=m[1].trim();

      value=value.replace(/\bstrasse\b/i,"Straße");

      return {
        value:value,
        matched:m[0]
      };
    }
  }

  return {
    value:"",
    matched:""
  };
}

/* ===================================================
   KUNDE
=================================================== */

function detectCustomer(text){
  const patterns=[
    /\bbei\s+(Herrn|Herr|Frau)\s+([A-ZÄÖÜ][A-Za-zÄÖÜäöüß\-]+)/i,
    /\bmit\s+(Herrn|Herr|Frau)\s+([A-ZÄÖÜ][A-Za-zÄÖÜäöüß\-]+)/i,
    /\b(Herrn|Herr|Frau)\s+([A-ZÄÖÜ][A-Za-zÄÖÜäöüß\-]+)/i
  ];

  for(const p of patterns){
    const m=text.match(p);

    if(m){
      const title=
        m[1].toLowerCase()==="frau"
        ? "Frau"
        : "Herr";

      return {
        value:title+" "+m[2],
        matched:m[0]
      };
    }
  }

  return {
    value:"",
    matched:""
  };
}

/* ===================================================
   TÄTIGKEIT
=================================================== */

function detectJob(text){
  const jobs=[
    ["dachbesichtigung","Dachbesichtigung"],
    ["dach besichtigen","Dach besichtigen"],
    ["dach ansehen","Dach ansehen"],
    ["dach prüfen","Dach prüfen"],
    ["dach kontrollieren","Dach kontrollieren"],
    ["flachdach besichtigen","Flachdach besichtigen"],
    ["flachdach ansehen","Flachdach ansehen"],
    ["steildach besichtigen","Steildach besichtigen"],
    ["steildach ansehen","Steildach ansehen"],
    ["aufmaß machen","Aufmaß machen"],
    ["aufmaß nehmen","Aufmaß nehmen"],
    ["angebot besprechen","Angebot besprechen"],
    ["angebot erstellen","Angebot erstellen"],
    ["baustelle besichtigen","Baustelle besichtigen"],
    ["baustelle ansehen","Baustelle ansehen"],
    ["reparatur ansehen","Reparatur ansehen"],
    ["reparatur durchführen","Reparatur durchführen"],
    ["sturmschaden ansehen","Sturmschaden ansehen"],
    ["schaden ansehen","Schaden ansehen"],
    ["beratung","Beratung"],
    ["besichtigung","Besichtigung"]
  ];

  const lower=text.toLowerCase();

  for(const pair of jobs){
    if(lower.includes(pair[0])){
      return pair[1];
    }
  }

  return "";
}

/* ===================================================
   GESPROCHENEN SATZ AUSWERTEN
=================================================== */

function parseVoice(original){
  let remaining=original
    .replace(/\s+/g," ")
    .trim();

  const date=detectDate(remaining);
  const time=detectTime(remaining);

  if(time.matched){
    remaining=remaining.replace(time.matched," ");
  }

  /*
    Adresse VOR Kundennamen auswerten.
    Dadurch wird "Lange Straße" nicht
    versehentlich als "Herr Lange" gelesen.
  */
  const address=detectAddress(remaining);

  if(address.matched){
    remaining=remaining.replace(address.matched," ");
  }

  const customer=detectCustomer(remaining);

  if(customer.matched){
    remaining=remaining.replace(customer.matched," ");
  }

  const job=detectJob(original);

  remaining=remaining
    .replace(/\b(heute|morgen|übermorgen)\b/ig," ")
    .replace(/\b(termin|treffen|Termin bei|treffen bei|treffen mit)\b/ig," ")
    .replace(/\b(um|uhr|bei|mit|zur|zum)\b/ig," ")
    .replace(/[,;.]+/g," ")
    .replace(/\s+/g," ")
    .trim();

  /*
    Bekannte Tätigkeit aus Rest entfernen,
    damit Notizen leer bleiben.
  */
  let cleaned=remaining;

  if(job){
    cleaned=cleaned.replace(
      new RegExp(
        job.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),
        "ig"
      ),
      " "
    );
  }

  cleaned=cleaned
    .replace(/\s+/g," ")
    .trim();

  editingId=null;

  el("editorTitle").textContent="Termin prüfen";
  el("deleteBtn").style.display="none";

  el("date").value=iso(date);

  el("start").value=time.value;

  el("end").value=
    time.value
    ? addMinutes(time.value,60)
    : "";

  el("customer").value=customer.value;

  el("address").value=address.value;

  el("phone").value="";

  el("job").value=
    job ||
    cleaned;

  /*
    Nur wenn wichtige Angaben fehlen,
    bleibt der Originalsatz zur Kontrolle
    in den Notizen.
  */
  if(
    !time.value ||
    !customer.value ||
    !address.value
  ){
    el("notes").value=
      "Bitte prüfen: "+original;
  }else{
    el("notes").value="";
  }

  show("editor");
}

el("calDate").value=iso();
renderToday();
</script>

</body>
</html>
