<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#176b3a">
<title>Dachdecker Karsak – Terminplaner</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f4;
  color:#17211b;
  padding-bottom:85px
}
header{
  background:#176b3a;
  color:white;
  padding:18px;
  text-align:center
}
header h1{margin:0;font-size:25px}
header p{margin:5px 0 0;font-size:14px}
.screen{display:none;padding:15px;max-width:800px;margin:auto}
.screen.active{display:block}
.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 9px #0002
}
h2{margin-top:0}
label{
  display:block;
  font-weight:bold;
  margin:12px 0 5px
}
input,textarea,select{
  width:100%;
  font-size:18px;
  padding:13px;
  border:1px solid #bbb;
  border-radius:10px;
  background:white
}
textarea{min-height:100px;resize:vertical}
button{
  border:0;
  border-radius:11px;
  padding:13px 15px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer
}
.primary{background:#176b3a;color:white;width:100%;margin-top:14px}
.secondary{background:#e7ece9;color:#17211b}
.danger{background:#b3261e;color:white}
.big{
  width:100%;
  min-height:70px;
  margin:7px 0;
  background:white;
  border:2px solid #176b3a;
  color:#176b3a;
  font-size:19px
}
.row{display:flex;gap:9px}
.row>*{flex:1}
.appointment{
  border-left:6px solid #176b3a;
  background:#f6faf7;
  padding:12px;
  margin:9px 0;
  border-radius:8px
}
.appointment b{font-size:18px}
.small{font-size:13px;color:#657069}
.empty{text-align:center;color:#777;padding:25px}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:white;
  border-top:1px solid #ccc;
  display:flex;
  z-index:10
}
.bottom button{
  flex:1;
  background:white;
  color:#333;
  border-radius:0;
  padding:5px;
  font-size:12px
}
.bottom button span{display:block;font-size:23px;margin-bottom:2px}
.voice{
  background:#176b3a;
  color:white;
  width:100%;
  font-size:19px;
  min-height:65px
}
.back{margin-bottom:12px}
.today{
  background:#e7f4eb;
  border:1px solid #9ac5a6
}
</style>
</head>

<body>

<header>
<h1>🏠 Dachdecker Karsak</h1>
<p>Terminplaner</p>
</header>

<section id="home" class="screen active">
  <div class="card">
    <h2>Heute</h2>
    <div id="todayList"></div>
  </div>

  <button class="big" onclick="newAppointment()">➕ Neuer Termin</button>
  <button class="big" onclick="show('calendar')">📅 Kalender</button>
  <button class="big" onclick="show('voice')">🎤 Spracheingabe</button>
  <button class="big" onclick="show('saved')">📋 Alle Termine</button>
</section>

<section id="calendar" class="screen">
  <button class="secondary back" onclick="show('home')">← Zurück</button>
  <div class="card">
    <h2>📅 Kalender</h2>
    <label>Datum auswählen</label>
    <input type="date" id="calDate" onchange="renderCalendar()">
    <div id="calendarList"></div>
  </div>
</section>

<section id="editor" class="screen">
  <button class="secondary back" onclick="show('home')">← Zurück</button>

  <div class="card">
    <h2 id="editorTitle">Neuer Termin</h2>

    <label>Datum *</label>
    <input type="date" id="date">

    <div class="row">
      <div>
        <label>Von *</label>
        <input type="time" id="start">
      </div>
      <div>
        <label>Bis</label>
        <input type="time" id="end">
      </div>
    </div>

    <label>Kunde / Name *</label>
    <input id="customer" placeholder="z.B. Herr Müller">

    <label>Adresse / Baustelle</label>
    <input id="address" placeholder="Straße, Ort">

    <label>Telefon</label>
    <input id="phone" type="tel" placeholder="Telefonnummer">

    <label>Arbeit / Termin</label>
    <input id="job" placeholder="z.B. Dach besichtigen">

    <label>Notizen</label>
    <textarea id="notes" placeholder="Weitere Informationen"></textarea>

    <button class="primary" onclick="saveAppointment()">💾 Termin speichern</button>
    <button id="deleteBtn" class="danger" style="display:none;width:100%;margin-top:10px" onclick="deleteAppointment()">🗑 Termin löschen</button>
  </div>
</section>

<section id="voice" class="screen">
  <button class="secondary back" onclick="show('home')">← Zurück</button>
  <div class="card">
    <h2>🎤 Spracheingabe</h2>
    <p>Tippe auf den Knopf und sprich deinen Termin.</p>
    <p class="small">Beispiel: „Morgen um 10 Uhr Herr Müller Dach besichtigen“</p>
    <button class="voice" onclick="startVoice()">🎤 Jetzt sprechen</button>
    <div id="voiceText" style="margin-top:15px"></div>
  </div>
</section>

<section id="saved" class="screen">
  <button class="secondary back" onclick="show('home')">← Zurück</button>
  <div class="card">
    <h2>📋 Alle Termine</h2>
    <div id="allList"></div>
  </div>
</section>

<div class="bottom">
  <button onclick="show('home')"><span>🏠</span>Heute</button>
  <button onclick="show('calendar')"><span>📅</span>Kalender</button>
  <button onclick="newAppointment()"><span>➕</span>Termin</button>
  <button onclick="show('voice')"><span>🎤</span>Sprache</button>
</div>

<script>
const KEY="karsakAppointmentsV2";
let appointments=JSON.parse(localStorage.getItem(KEY)||"[]");
let editingId=null;

function iso(d=new Date()){
  let y=d.getFullYear();
  let m=String(d.getMonth()+1).padStart(2,"0");
  let day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function esc(s){
  return String(s||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function show(id){
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  if(id==="home") renderToday();
  if(id==="calendar") renderCalendar();
  if(id==="saved") renderAll();

  window.scrollTo(0,0);
}

function sorted(items){
  return [...items].sort((a,b)=>
    (a.date+" "+a.start).localeCompare(b.date+" "+b.start)
  );
}

function appointmentHTML(a){
  return `
    <div class="appointment" onclick="editAppointment('${a.id}')">
      <b>${esc(a.start||"")} ${esc(a.customer)}</b><br>
      ${a.end ? esc(a.start)+" – "+esc(a.end)+" Uhr<br>" : ""}
      ${a.job ? "🔨 "+esc(a.job)+"<br>" : ""}
      ${a.address ? "📍 "+esc(a.address)+"<br>" : ""}
      ${a.phone ? "📞 "+esc(a.phone)+"<br>" : ""}
      ${a.notes ? "<span class='small'>"+esc(a.notes)+"</span>" : ""}
    </div>`;
}

function list(items,target){
  const box=document.getElementById(target);
  if(!items.length){
    box.innerHTML="<div class='empty'>Keine Termine vorhanden</div>";
    return;
  }
  box.innerHTML=sorted(items).map(appointmentHTML).join("");
}

function renderToday(){
  list(appointments.filter(a=>a.date===iso()),"todayList");
}

function renderCalendar(){
  let d=document.getElementById("calDate").value || iso();
  document.getElementById("calDate").value=d;
  list(appointments.filter(a=>a.date===d),"calendarList");
}

function renderAll(){
  list(appointments,"allList");
}

function newAppointment(){
  editingId=null;
  document.getElementById("editorTitle").textContent="Neuer Termin";
  document.getElementById("deleteBtn").style.display="none";

  document.getElementById("date").value=iso();
  document.getElementById("start").value="";
  document.getElementById("end").value="";
  document.getElementById("customer").value="";
  document.getElementById("address").value="";
  document.getElementById("phone").value="";
  document.getElementById("job").value="";
  document.getElementById("notes").value="";

  show("editor");
}

function editAppointment(id){
  const a=appointments.find(x=>x.id===id);
  if(!a)return;

  editingId=id;
  document.getElementById("editorTitle").textContent="Termin bearbeiten";
  document.getElementById("deleteBtn").style.display="block";

  document.getElementById("date").value=a.date||"";
  document.getElementById("start").value=a.start||"";
  document.getElementById("end").value=a.end||"";
  document.getElementById("customer").value=a.customer||"";
  document.getElementById("address").value=a.address||"";
  document.getElementById("phone").value=a.phone||"";
  document.getElementById("job").value=a.job||"";
  document.getElementById("notes").value=a.notes||"";

  show("editor");
}

function saveAppointment(){
  const a={
    id:editingId || String(Date.now()),
    date:document.getElementById("date").value,
    start:document.getElementById("start").value,
    end:document.getElementById("end").value,
    customer:document.getElementById("customer").value.trim(),
    address:document.getElementById("address").value.trim(),
    phone:document.getElementById("phone").value.trim(),
    job:document.getElementById("job").value.trim(),
    notes:document.getElementById("notes").value.trim()
  };

  if(!a.date || !a.start || !a.customer){
    alert("Bitte Datum, Uhrzeit und Kunde eintragen.");
    return;
  }

  if(editingId){
    appointments=appointments.map(x=>x.id===editingId?a:x);
  }else{
    appointments.push(a);
  }

  localStorage.setItem(KEY,JSON.stringify(appointments));
  editingId=null;
  alert("Termin gespeichert.");
  show("home");
}

function deleteAppointment(){
  if(!editingId)return;
  if(!confirm("Diesen Termin wirklich löschen?"))return;

  appointments=appointments.filter(x=>x.id!==editingId);
  localStorage.setItem(KEY,JSON.stringify(appointments));
  editingId=null;
  show("home");
}

function startVoice(){
  const SpeechRecognition=
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("Die Spracheingabe wird von diesem Browser nicht unterstützt.");
    return;
  }

  const r=new SpeechRecognition();
  r.lang="de-DE";
  r.interimResults=false;

  document.getElementById("voiceText").innerHTML="<b>Ich höre zu …</b>";

  r.onresult=function(e){
    const text=e.results[0][0].transcript;
    document.getElementById("voiceText").innerHTML=
      "<b>Erkannt:</b><br>"+esc(text);

    newAppointment();
    document.getElementById("notes").value=text;
  };

  r.onerror=function(){
    document.getElementById("voiceText").textContent=
      "Sprache konnte nicht erkannt werden.";
  };

  r.start();
}

document.getElementById("calDate").value=iso();
renderToday();
</script>

</body>
</html>
