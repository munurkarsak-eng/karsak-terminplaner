<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111b"><title>Dachdecker Karsak – Terminplaner</title><style>body{margin:0;font-family:Arial;background:#07111b;color:#fff}.app{max-width:700px;margin:auto;padding:18px 16px 100px}.logo{text-align:center;color:#f0b83f}.logo h1{color:#fff;letter-spacing:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.big,.card,button,input,textarea,select{border-radius:14px}.big{background:#13202c;border:1px solid #30404f;color:#fff;padding:20px;font-weight:bold;font-size:17px}.card{background:#101b27;border:1px solid #30404f;padding:16px;margin-top:16px}.gold{background:#f0b83f;color:#16120b}.secondary{background:#1c2a38;color:#fff}.danger{background:#5b2226;color:#fff}button{border:0;padding:12px;font-size:16px;font-weight:bold}input,textarea,select{width:100%;box-sizing:border-box;background:#0c1620;color:#fff;border:1px solid #3a4b5b;padding:12px;margin:6px 0 12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.screen{display:none}.screen.active{display:block}.appointment{border-top:1px solid #384655;padding:12px 0}.time{color:#ffd46b;font-weight:bold}.warning{background:#40191c;border:1px solid #e14c4c;padding:12px;border-radius:12px}.success{background:#153a26;border:1px solid #39b96b;padding:12px;border-radius:12px}.full{width:100%;margin-top:10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#09131d;border-top:1px solid #334353}.bottom div{max-width:700px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.bottom button{background:none;color:#fff;font-size:13px}</style></head><body><div class="app">
<section id="home" class="screen active"><div class="logo"><div style="font-size:60px">⌂K</div><small>DACHDECKER</small><h1>KARSAK</h1><h2>TERMINPLANER</h2></div><div class="grid"><button class="big" onclick="show('calendar')">📅<br>KALENDER</button><button class="big" onclick="show('voice')">🎤<br>TERMIN SPRECHEN</button><button class="big" onclick="newAppt()">➕<br>NEUER TERMIN</button><button class="big" onclick="nextNav()">📍<br>NAVIGATION</button></div><div class="card"><h3>HEUTIGE TERMINE</h3><div id="today"></div></div></section>
<section id="calendar" class="screen"><button class="secondary" onclick="show('home')">← Zurück</button><div class="card"><h3>📅 Kalender</h3><input type="date" id="calDate" onchange="renderDay()"><div id="dayList"></div><button class="gold full" onclick="newFromDay()">+ Termin an diesem Tag</button></div></section>
<section id="editor" class="screen"><button class="secondary" onclick="show('home')">← Zurück</button><div class="card"><h3>➕ Neuer Termin</h3><input type="hidden" id="editId"><label>Datum</label><input type="date" id="date"><div class="row"><div><label>Beginn</label><input type="time" id="start"></div><div><label>Ende</label><input type="time" id="end"></div></div><label>Kunde / Name</label><input id="customer"><label>Baustellenadresse</label><input id="address"><label>Telefonnummer</label><input id="phone"><label>Notiz</label><textarea id="note"></textarea><label>Fahrzeit-Puffer</label><select id="buffer"><option>0</option><option>15</option><option selected>30</option><option>45</option><option>60</option></select><div id="warn"></div><button class="gold full" onclick="checkSave()">TERMIN PRÜFEN & SPEICHERN</button></div></section>
<section id="voice" class="screen"><button class="secondary" onclick="show('home')">← Zurück</button><div class="card" style="text-align:center"><h3>🎤 Termin sprechen</h3><div style="font-size:70px">🎤</div><div id="voiceText">Noch nichts gesprochen.</div><button class="gold full" onclick="startVoice()">SPRACHEINGABE STARTEN</button><button class="secondary full" onclick="useVoice()">Erkannte Angaben übernehmen</button></div></section>
<section id="conflict" class="screen"><button class="secondary" onclick="show('editor')">← Zurück</button><div class="card"><h3>⚠️ Terminüberschneidung</h3><div id="conflictMsg" class="warning"></div><button class="gold full" onclick="show('editor')">Uhrzeit ändern</button><button class="secondary full" onclick="forceSave()">Trotzdem speichern</button></div></section>
<section id="saved" class="screen"><button class="secondary" onclick="show('home')">← Startseite</button><div class="card"><div class="success">✅ Termin gespeichert.</div><div id="savedSum"></div><button class="gold full" onclick="navSaved()">📍 NAVIGATION STARTEN</button></div></section></div>
<div class="bottom"><div><button onclick="show('home')">🏠<br>Start</button><button onclick="show('calendar')">📅<br>Kalender</button><button onclick="newAppt()">➕<br>Termin</button><button onclick="nextNav()">📍<br>Navigation</button></div></div>
<script>
let A=JSON.parse(localStorage.getItem('karsakAppointments')||'[]'),P=null,L=null,S='';const $=x=>document.getElementById(x);function save(){localStorage.setItem('karsakAppointments',JSON.stringify(A))}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(id==='home')renderToday();if(id==='calendar')renderDay();scrollTo(0,0)}function iso(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function gdate(s){if(!s)return'';let[y,m,d]=s.split('-');return d+'.'+m+'.'+y}function mins(t){let[h,m]=t.split(':').map(Number);return h*60+m}function add(t,n){let x=mins(t)+n;return String(Math.floor(x/60)%24).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function esc(t){return String(t||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function list(items,target){let c=$(target);c.innerHTML='';items.sort((a,b)=>a.start.localeCompare(b.start));if(!items.length){c.innerHTML='<p>Keine Termine eingetragen.</p>';return}items.forEach(a=>{let d=document.createElement('div');d.className='appointment';d.innerHTML=`<div class="time">${a.start} – ${a.end}</div><b>${esc(a.customer)||'Ohne Namen'}</b><div>📍 ${esc(a.address)||'Keine Adresse'}<br>${a.phone?'📞 '+esc(a.phone)+'<br>':''}${a.note?'📝 '+esc(a.note):''}</div><p><button class="gold" onclick="nav('${a.id}')">Navigation</button> <button class="secondary" onclick="edit('${a.id}')">Bearbeiten</button> <button class="danger" onclick="del('${a.id}')">Löschen</button></p>`;c.appendChild(d)})}
function renderToday(){list(A.filter(a=>a.date===iso()),'today')}function renderDay(){if(!$('calDate').value)$('calDate').value=iso();list(A.filter(a=>a.date===$('calDate').value),'dayList')}function clearE(){['editId','date','start','end','customer','address','phone','note'].forEach(i=>$(i).value='');$('warn').innerHTML=''}function newAppt(){clearE();$('date').value=iso();$('start').value='08:00';$('end').value='09:00';show('editor')}function newFromDay(){clearE();$('date').value=$('calDate').value||iso();$('start').value='08:00';$('end').value='09:00';show('editor')}function data(){return{id:$('editId').value||Date.now().toString(),date:$('date').value,start:$('start').value,end:$('end').value,customer:$('customer').value.trim(),address:$('address').value.trim(),phone:$('phone').value.trim(),note:$('note').value.trim(),buffer:Number($('buffer').value)}}
function checkSave(){let a=data();if(!a.date||!a.start||!a.end){$('warn').innerHTML='<div class="warning">Bitte Datum, Beginn und Ende eingeben.</div>';return}if(a.end<=a.start){$('warn').innerHTML='<div class="warning">Endzeit muss nach Startzeit liegen.</div>';return}let c=conflict(a);if(c){P=a;$('conflictMsg').innerHTML=c;show('conflict')}else store(a)}function conflict(a){let s=mins(a.start),e=mins(a.end),b=a.buffer||0;for(let o of A.filter(x=>x.date===a.date&&x.id!==a.id)){let os=mins(o.start),oe=mins(o.end);if(s<oe&&e>os)return `Dieser Termin überschneidet sich mit <b>${o.start}–${o.end}</b> ${esc(o.customer)}.`;if(e<=os&&os-e<b)return `Zwischen den Terminen bleiben nur <b>${os-e} Minuten</b>.`;if(s>=oe&&s-oe<b)return `Für die Anfahrt bleiben nur <b>${s-oe} Minuten</b>.`}return null}function forceSave(){if(P){store(P);P=null}}function store(a){let i=A.findIndex(x=>x.id===a.id);i>=0?A[i]=a:A.push(a);save();L=a;$('savedSum').innerHTML=`<p><b>${gdate(a.date)} ${a.start}–${a.end}</b><br>${esc(a.customer)}<br>📍 ${esc(a.address)}</p>`;show('saved')}function edit(id){let a=A.find(x=>x.id===id);if(!a)return;$('editId').value=a.id;['date','start','end','customer','address','phone','note'].forEach(k=>$(k).value=a[k]||'');$('buffer').value=a.buffer??30;show('editor')}function del(id){if(confirm('Termin wirklich löschen?')){A=A.filter(a=>a.id!==id);save();renderToday();renderDay()}}function maps(addr){open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(addr),'_blank')}function nav(id){let a=A.find(x=>x.id===id);a&&a.address?maps(a.address):alert('Keine Adresse gespeichert.')}function navSaved(){L&&L.address?maps(L.address):alert('Keine Adresse gespeichert.')}function nextNav(){let n=new Date(),m=n.getHours()*60+n.getMinutes(),a=A.filter(x=>x.date===iso()&&mins(x.start)>=m&&x.address).sort((x,y)=>x.start.localeCompare(y.start))[0];a?maps(a.address):alert('Kein kommender Termin mit Adresse gefunden.')}
function startVoice(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('Bitte Chrome verwenden.');return}let r=new R();r.lang='de-DE';r.start();r.onresult=e=>{S=e.results[0][0].transcript;$('voiceText').textContent=S}}function useVoice(){if(!S){alert('Bitte zuerst sprechen.');return}clearE();let l=S.toLowerCase(),d=new Date();if(l.includes('übermorgen'))d.setDate(d.getDate()+2);else if(l.includes('morgen'))d.setDate(d.getDate()+1);$('date').value=iso(d);let t=l.match(/(?:um\s*)?(\d{1,2})(?::|\.| uhr\s*)(\d{2})?/);let st=t?String(Number(t[1])).padStart(2,'0')+':'+String(Number(t[2]||0)).padStart(2,'0'):'08:00';$('start').value=st;$('end').value=add(st,60);$('note').value=S;show('editor')}
$('calDate').value=iso();renderToday();
</script></body></html>
