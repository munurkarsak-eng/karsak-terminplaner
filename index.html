<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#07131d">

<title>Dachdecker Karsak – Terminplaner</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07131d;
  color:#fff;
  padding-bottom:85px
}

header{
  text-align:center;
  padding:22px 15px;
  border-bottom:1px solid #263746
}

.logo{
  font-size:38px;
  color:#f6bb2f;
  font-weight:bold
}

header h1{
  margin:5px 0;
  font-size:27px
}

.gold{
  color:#f6bb2f;
  font-size:21px;
  font-weight:bold
}

.screen{
  display:none;
  padding:16px;
  max-width:760px;
  margin:auto
}

.screen.active{
  display:block
}

.card{
  background:#10202c;
  border:1px solid #304451;
  border-radius:18px;
  padding:17px;
  margin-bottom:15px
}

h2{margin-top:0}

label{
  display:block;
  font-weight:bold;
  font-size:20px;
  margin:15px 0 7px
}

input,textarea{
  width:100%;
  padding:15px;
  border-radius:13px;
  border:1px solid #aaa;
  background:white;
  color:#111;
  font-size:20px
}

textarea{
  min-height:110px
}

.row{
  display:flex;
  gap:12px
}

.row>div{
  flex:1
}

button{
  border:0;
  border-radius:13px;
  padding:14px;
  font-weight:bold;
  font-size:17px
}

.big{
  width:100%;
  min-height:72px;
  margin-bottom:12px;
  background:#10202c;
  color:white;
  border:1px solid #344654
}

.primary{
  width:100%;
  margin-top:16px;
  background:#f6bb2f;
  color:#111;
  font-size:20px
}

.secondary{
  background:#263746;
  color:white
}

.danger{
  width:100%;
  margin-top:10px;
  background:#9e2727;
  color:white
}

.voiceButton{
  width:100%;
  min-height:85px;
  background:#f6bb2f;
  color:#111;
  font-size:21px
}

.voiceResult{
  margin-top:15px;
  padding:14px;
  border-radius:12px;
  background:#172a38;
  line-height:1.5
}

.appointment{
  background:#172a38;
  border-left:5px solid #f6bb2f;
  border-radius:10px;
  padding:13px;
  margin:10px 0
}

.small{
  color:#b5c0c8;
  font-size:14px
}

.empty{
  color:#aeb9c1;
  padding:25px;
  text-align:center
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:78px;
  background:#09141e;
  border-top:1px solid #304451;
  display:flex;
  z-index:50
}

.bottom button{
  flex:1;
  background:transparent;
  color:white;
  border-radius:0;
  font-size:13px;
  padding:6px 2px
}

.bottom span{
  display:block;
  font-size:25px
}
</style>
</head>

<body>

<header>
  <div class="logo">⌂K</div>
  <h1>DACHDECKER KARSAK</h1>
  <div class="gold">TERMINPLANER</div>
</header>

<section id="home" class="screen active">

  <div class="card">
    <h2>HEUTIGE TERMINE</h2>
    <div id="todayList"></div>
  </div>

  <button class="big" onclick="show('calendar')">
    📅 KALENDER
  </button>

  <button class="big" onclick="show('voice')">
    🎤 TERMIN SPRECHEN
  </button>

  <button class="big" onclick="newAppointment()">
    ➕ NEUER TERMIN
  </button>

  <button class="big" onclick="show('saved')">
    📋 ALLE TERMINE
  </button>

</section>


<section id="voice" class="screen">

  <button class="secondary" onclick="show('home')">
    ← Zurück
  </button>

  <div class="card">

    <h2>🎤 Termin sprechen</h2>

    <p>Zum Beispiel:</p>

    <p class="small">
      „Morgen um 7 Uhr 30 bei Herrn Karsak,
      Lange Straße 67, Dach besichtigen“
    </p>

    <button class="voiceButton" onclick="startVoice()">
      🎤 JETZT SPRECHEN
    </button>

    <div id="voiceText" class="voiceResult">
      Noch nichts gesprochen.
    </div>

  </div>
</section>


<section id="editor" class="screen">

  <button class="secondary" onclick="show('home')">
    ← Zurück
  </button>

  <div class="card">

    <h2 id="editorTitle">Neuer Termin</h2>

    <label>Datum *</label>
    <input type="date" id="date">

    <div class="row">

      <div>
        <label>Von *</label>
        <input type="time" id="start">
      </div>

      <div>
        <label>Bis</label>
        <input type="time" id="end">
      </div>

    </div>

    <label>Kunde / Name *</label>
    <input id="customer"
           placeholder="z.B. Herr Müller">

    <label>Adresse / Baustelle</label>
    <input id="address"
           placeholder="z.B. Lange Straße 67, Wunstorf">

    <label>Telefon</label>
    <input id="phone"
           type="tel"
           placeholder="Telefonnummer">

    <label>Arbeit / Termin</label>
    <input id="job"
           placeholder="z.B. Dach besichtigen">

    <label>Notizen</label>
    <textarea id="notes"></textarea>

    <button class="primary"
            onclick="saveAppointment()">
      💾 Termin speichern
    </button>

    <button id="deleteBtn"
            class="danger"
            style="display:none"
            onclick="deleteAppointment()">
      🗑 Termin löschen
    </button>

  </div>
</section>


<section id="calendar" class="screen">

  <button class="secondary" onclick="show('home')">
    ← Zurück
  </button>

  <div class="card">

    <h2>📅 Kalender</h2>

    <input type="date"
           id="calDate"
           onchange="renderCalendar()">

    <div id="calendarList"></div>

  </div>

</section>


<section id="saved" class="screen">

  <button class="secondary" onclick="show('home')">
    ← Zurück
  </button>

  <div class="card">
    <h2>Alle Termine</h2>
    <div id="allList"></div>
  </div>

</section>


<div class="bottom">

  <button onclick="show('home')">
    <span>🏠</span>
    Start
  </button>

  <button onclick="show('calendar')">
    <span>📅</span>
    Kalender
  </button>

  <button onclick="newAppointment()">
    <span>➕</span>
    Termin
  </button>

  <button onclick="show('voice')">
    <span>🎤</span>
    Sprache
  </button>

</div>


<script>

const KEY="karsakAppointmentsV4";

let appointments =
  JSON.parse(localStorage.getItem(KEY)||"[]");

let editingId=null;


/* GRUNDFUNKTIONEN */

function el(id){
  return document.getElementById(id);
}


function iso(d=new Date()){

  const y=d.getFullYear();

  const m=
    String(d.getMonth()+1)
    .padStart(2,"0");

  const day=
    String(d.getDate())
    .padStart(2,"0");

  return `${y}-${m}-${day}`;
}


function addMinutes(time,minutes){

  if(!time)return "";

  let [h,m]=
    time.split(":").map(Number);

  let total=
    h*60+m+minutes;

  let hh=
    String(
      Math.floor(total/60)%24
    ).padStart(2,"0");

  let mm=
    String(
      total%60
    ).padStart(2,"0");

  return hh+":"+mm;
}


function esc(value){

  return String(value||"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;");
}


function show(id){

  document
  .querySelectorAll(".screen")
  .forEach(
    x=>x.classList.remove("active")
  );

  el(id)
  .classList.add("active");

  if(id==="home"){
    renderToday();
  }

  if(id==="calendar"){
    renderCalendar();
  }

  if(id==="saved"){
    renderAll();
  }

  window.scrollTo(0,0);
}


/* TERMINE ANZEIGEN */

function appointmentHTML(a){

  return `
  <div class="appointment"
       onclick="editAppointment('${a.id}')">

    <b>
      ${esc(a.start)}
      ${esc(a.customer)}
    </b>

    <br>

    ${
      a.end
      ? esc(a.start)+" – "+esc(a.end)+" Uhr<br>"
      : ""
    }

    ${
      a.address
      ? "📍 "+esc(a.address)+"<br>"
      : ""
    }

    ${
      a.job
      ? "🔨 "+esc(a.job)+"<br>"
      : ""
    }

    ${
      a.phone
      ? "📞 "+esc(a.phone)+"<br>"
      : ""
    }

    ${
      a.notes
      ? "<span class='small'>"+
        esc(a.notes)+
        "</span>"
      : ""
    }

  </div>`;
}


function list(items,target){

  let box=el(target);

  if(!items.length){

    box.innerHTML=
    "<div class='empty'>"+
    "Keine Termine eingetragen."+
    "</div>";

    return;
  }

  items=
    [...items].sort(
      (a,b)=>
      (a.date+" "+a.start)
      .localeCompare(
        b.date+" "+b.start
      )
    );

  box.innerHTML=
    items
    .map(appointmentHTML)
    .join("");
}


function renderToday(){

  list(
    appointments.filter(
      a=>a.date===iso()
    ),
    "todayList"
  );
}


function renderCalendar(){

  let date=
    el("calDate").value||iso();

  el("calDate").value=date;

  list(
    appointments.filter(
      a=>a.date===date
    ),
    "calendarList"
  );
}


function renderAll(){

  list(
    appointments,
    "allList"
  );
}


/* TERMIN BEARBEITEN */

function newAppointment(){

  editingId=null;

  el("editorTitle")
  .textContent="Neuer Termin";

  el("deleteBtn")
  .style.display="none";

  el("date").value=iso();

  el("start").value="";

  el("end").value="";

  el("customer").value="";

  el("address").value="";

  el("phone").value="";

  el("job").value="";

  el("notes").value="";

  show("editor");
}


function editAppointment(id){

  let a=
    appointments.find(
      x=>x.id===id
    );

  if(!a)return;

  editingId=id;

  el("editorTitle")
  .textContent=
  "Termin bearbeiten";

  el("deleteBtn")
  .style.display="block";

  el("date").value=
    a.date||"";

  el("start").value=
    a.start||"";

  el("end").value=
    a.end||"";

  el("customer").value=
    a.customer||"";

  el("address").value=
    a.address||"";

  el("phone").value=
    a.phone||"";

  el("job").value=
    a.job||"";

  el("notes").value=
    a.notes||"";

  show("editor");
}


function saveAppointment(){

  let a={

    id:
      editingId||
      String(Date.now()),

    date:
      el("date").value,

    start:
      el("start").value,

    end:
      el("end").value,

    customer:
      el("customer")
      .value.trim(),

    address:
      el("address")
      .value.trim(),

    phone:
      el("phone")
      .value.trim(),

    job:
      el("job")
      .value.trim(),

    notes:
      el("notes")
      .value.trim()
  };


  if(
    !a.date||
    !a.start||
    !a.customer
  ){

    alert(
      "Bitte Datum, Uhrzeit und Kunde kontrollieren."
    );

    return;
  }


  if(editingId){

    appointments=
      appointments.map(
        x=>x.id===editingId
        ?a
        :x
      );

  }else{

    appointments.push(a);
  }


  localStorage.setItem(
    KEY,
    JSON.stringify(appointments)
  );


  editingId=null;

  alert("Termin gespeichert.");

  show("home");
}


function deleteAppointment(){

  if(!editingId)return;

  if(
    !confirm(
      "Termin wirklich löschen?"
    )
  )return;


  appointments=
    appointments.filter(
      a=>a.id!==editingId
    );


  localStorage.setItem(
    KEY,
    JSON.stringify(appointments)
  );


  editingId=null;

  show("home");
}


/* ==========================
   SPRACHERKENNUNG
========================== */

function startVoice(){

  const Recognition=
    window.SpeechRecognition||
    window.webkitSpeechRecognition;


  if(!Recognition){

    alert(
      "Bitte Chrome verwenden. "+
      "Die Spracheingabe wird von diesem Browser nicht unterstützt."
    );

    return;
  }


  const recognition=
    new Recognition();


  recognition.lang="de-DE";

  recognition.interimResults=false;

  recognition.continuous=false;


  el("voiceText")
  .innerHTML=
  "<b>🎤 Ich höre zu …</b>";


  recognition.onresult=
  function(event){

    const spoken=
      event.results[0][0]
      .transcript
      .trim();


    el("voiceText")
    .innerHTML=
      "<b>Erkannt:</b><br>"+
      esc(spoken);


    parseVoice(spoken);
  };


  recognition.onerror=
  function(){

    el("voiceText")
    .innerHTML=
      "Sprache konnte nicht erkannt werden."+
      "<br>"+
      "<span class='small'>"+
      "Bitte noch einmal sprechen."+
      "</span>";
  };


  recognition.start();
}


/* ==========================
   SPRACHSATZ ZERLEGEN
========================== */

function parseVoice(original){

  let work=
    original
    .replace(/\s+/g," ")
    .trim();


  /* DATUM */

  let date=new Date();


  if(
    /\bübermorgen\b/i.test(work)
  ){

    date.setDate(
      date.getDate()+2
    );

  }
  else if(
    /\bmorgen\b/i.test(work)
  ){

    date.setDate(
      date.getDate()+1
    );

  }
  else if(
    /\bheute\b/i.test(work)
  ){

  }
  else{

    let dm=
      work.match(
        /\b(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?\b/
      );


    if(dm){

      let day=
        Number(dm[1]);

      let month=
        Number(dm[2])-1;

      let year=
        dm[3]
        ?Number(dm[3])
        :new Date().getFullYear();


      if(year<100){
        year+=2000;
      }


      date=
        new Date(
          year,
          month,
          day
        );
    }
  }


  /* ADRESSE ZUERST ERKENNEN */

  let address="";


  const streetRegex=
  /\b([A-ZÄÖÜ][A-Za-zÄÖÜäöüß\-]*(?:\s+[A-ZÄÖÜ][A-Za-zÄÖÜäöüß\-]*)*\s+(?:Straße|Strasse|Weg|Allee|Platz|Ring|Damm|Gasse|Stieg|Chaussee|Kamp|Ufer|Markt|Feld|Hof)\s+\d+[a-zA-Z]?)\b/i;


  let streetMatch=
    work.match(streetRegex);


  if(streetMatch){

    address=
      streetMatch[1]
      .replace(
        /\bstrasse\b/i,
        "Straße"
      )
      .trim();


    work=
      work.replace(
        streetMatch[0],
        " "
      );
  }


  /* UHRZEIT */

  let start="";


  let timePatterns=[

    /\bum\s+(\d{1,2})\s*uhr\s*(\d{1,2})?\b/i,

    /\bum\s+(\d{1,2})[:.](\d{2})\s*(?:uhr)?\b/i,

    /\b(\d{1,2})[:.](\d{2})\s*uhr\b/i,

    /\b(\d{1,2})\s*uhr\s*(\d{1,2})?\b/i

  ];


  let timeMatch=null;


  for(
    let pattern of timePatterns
  ){

    timeMatch=
      work.match(pattern);

    if(timeMatch)break;
  }


  if(timeMatch){

    let hour=
      Number(timeMatch[1]);

    let minute=
      Number(timeMatch[2]||0);


    if(
      hour>=0 &&
      hour<=23 &&
      minute>=0 &&
      minute<=59
    ){

      start=
        String(hour)
        .padStart(2,"0")
        +":"+
        String(minute)
        .padStart(2,"0");
    }


    work=
      work.replace(
        timeMatch[0],
        " "
      );
  }


  /* DATUMSWÖRTER ENTFERNEN */

  work=
    work.replace(
      /\b(heute|morgen|übermorgen)\b/ig,
      " "
    );


  /* KUNDE */

  let customer="";


  let customerMatch=
    work.match(
      /\b(?:bei|mit|zu)\s+(Herrn|Herr|Frau)\s+([A-ZÄÖÜ][A-Za-zÄÖÜäöüß\-]+(?:\s+[A-ZÄÖÜ][A-Za-zÄÖÜäöüß\-]+)?)/i
    );


  if(customerMatch){

    let title=
      customerMatch[1]
      .toLowerCase();


    if(
      title==="herr" ||
      title==="herrn"
    ){

      title="Herr";

    }else{

      title="Frau";
    }


    let name=
      customerMatch[2]
      .trim();


    customer=
      title+" "+name;


    work=
      work.replace(
        customerMatch[0],
        " "
      );
  }


  /* FALLBACK:
     Herr/Frau ohne "bei"
  */

  if(!customer){

    let fallback=
      work.match(
        /\b(Herrn|Herr|Frau)\s+([A-ZÄÖÜ][A-Za-zÄÖÜäöüß\-]+)/i
      );


    if(fallback){

      let title=
        fallback[1]
        .toLowerCase();


      title=
        title==="frau"
        ?"Frau"
        :"Herr";


      customer=
        title+" "+
        fallback[2];


      work=
        work.replace(
          fallback[0],
          " "
        );
    }
  }


  /* UNNÖTIGE WÖRTER ENTFERNEN */

  work=
    work
    .replace(
      /\b(termin|termin bei|treffen|treffen bei)\b/ig,
      " "
    )
    .replace(
      /\b(um|bei|mit|in|am|gegen)\b/ig,
      " "
    )
    .replace(
      /[,;.]+/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();


  /* TÄTIGKEIT */

  let job="";


  const knownJobs=[

    "Dach besichtigen",

    "Dach ansehen",

    "Dach prüfen",

    "Dach kontrollieren",

    "Flachdach besichtigen",

    "Flachdach ansehen",

    "Steildach besichtigen",

    "Steildach ansehen",

    "Aufmaß machen",

    "Aufmaß nehmen",

    "Angebot besprechen",

    "Angebot erstellen",

    "Baustelle besichtigen",

    "Baustelle ansehen",

    "Reparatur ansehen",

    "Reparatur durchführen",

    "Sturmschaden ansehen",

    "Schaden ansehen",

    "Kundenbesuch",

    "Beratung",

    "Besichtigung"
  ];


  let lower=
    original.toLowerCase();


  for(
    let candidate of knownJobs
  ){

    if(
      lower.includes(
        candidate.toLowerCase()
      )
    ){

      job=candidate;

      break;
    }
  }


  /* REST ALS TÄTIGKEIT */

  if(!job && work){

    job=
      work
      .replace(
        /^\s+|\s+$/g,
        ""
      );
  }


  /* NOTIZEN */

  let notes="";


  /*
    Wenn die wichtigsten Daten sauber
    erkannt wurden, brauchen wir den
    ganzen gesprochenen Satz nicht
    zusätzlich in den Notizen.
  */

  if(
    !customer ||
    !address ||
    !start
  ){

    notes=
      "Gesprochen: "+
      original;
  }


  /* FELDER FÜLLEN */

  editingId=null;


  el("editorTitle")
  .textContent=
  "Termin prüfen";


  el("deleteBtn")
  .style.display="none";


  el("date").value=
    iso(date);


  el("start").value=
    start;


  el("end").value=
    start
    ?addMinutes(start,60)
    :"";


  el("customer").value=
    customer;


  el("address").value=
    address;


  el("phone").value=
    "";


  el("job").value=
    job;


  el("notes").value=
    notes;


  show("editor");
}


/* START */

el("calDate").value=iso();

renderToday();

</script>

</body>
</html>
